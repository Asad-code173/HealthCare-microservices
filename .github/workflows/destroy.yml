name: Destroy AWS Demo Stack

on:
  workflow_dispatch:
    inputs:
      confirm_project_name:
        description: Type the exact project name to confirm destroy.
        required: true
        type: string
      destroy_backend_bucket:
        description: Also delete the Terraform state bucket after destroy.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'eks-healthcare' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'healthcare/eks/terraform.tfstate' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  TF_IN_AUTOMATION: true

concurrency:
  group: eks-healthcare-destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Terraform-managed AWS resources
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Validate required GitHub configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TF_STATE_BUCKET}" ]]; then
            echo "TF_STATE_BUCKET GitHub variable is required."
            exit 1
          fi

          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "AWS_ROLE_TO_ASSUME GitHub variable is required."
            exit 1
          fi

          if [[ -z "${{ secrets.TF_VAR_db_password }}" ]]; then
            echo "TF_VAR_db_password GitHub secret is required."
            exit 1
          fi

          if [[ -z "${{ secrets.GRAFANA_PASSWORD }}" ]]; then
            echo "GRAFANA_PASSWORD GitHub secret is required."
            exit 1
          fi

      - name: Confirm manual destroy request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.inputs.confirm_project_name }}" != "${PROJECT_NAME}" ]]; then
            echo "Confirmation failed. Type the exact project name: ${PROJECT_NAME}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Force remove Terraform state lock if exists
        shell: bash
        run: |
          set -euo pipefail

          LOCK_FILE="s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}.tflock"

          if aws s3 ls "${LOCK_FILE}" 2>/dev/null; then
            echo "Stale lock found. Removing..."
            aws s3 rm "${LOCK_FILE}"
            echo "Lock removed successfully."
          else
            echo "No lock found. Proceeding..."
          fi

      - name: Confirm Terraform state bucket exists
        shell: bash
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Terraform state bucket not found: ${TF_STATE_BUCKET}"
            echo "Nothing to destroy from the remote backend."
            exit 1
          fi

      # ✅ FIX 1: RDS Deletion Protection Disable
      - name: Pre-destroy - Disable RDS Deletion Protection
        shell: bash
        run: |
          set -euo pipefail

          DB_INSTANCE="${PROJECT_NAME}-postgres"

          if aws rds describe-db-instances \
            --db-instance-identifier "${DB_INSTANCE}" \
            --region "${AWS_REGION}" >/dev/null 2>&1; then

            echo "Disabling deletion protection on: ${DB_INSTANCE}"
            aws rds modify-db-instance \
              --db-instance-identifier "${DB_INSTANCE}" \
              --no-deletion-protection \
              --region "${AWS_REGION}"

            echo "Waiting for RDS modification (30s)..."
            sleep 30
            echo "RDS protection disabled!"
          else
            echo "RDS instance not found, skipping..."
          fi

      # ✅ FIX 2: NAT Gateway + Elastic IPs Remove
      - name: Pre-destroy - Remove NAT Gateways and Elastic IPs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Deleting NAT Gateways ==="
          for nat_id in $(aws ec2 describe-nat-gateways \
            --region "${AWS_REGION}" \
            --filter "Name=state,Values=available" \
            --query 'NatGateways[].NatGatewayId' \
            --output text); do
            echo "Deleting NAT Gateway: $nat_id"
            aws ec2 delete-nat-gateway \
              --nat-gateway-id "$nat_id" \
              --region "${AWS_REGION}"
          done

          echo "=== Waiting for NAT Gateways to delete (90s) ==="
          sleep 90

          echo "=== Releasing Elastic IPs ==="
          for alloc_id in $(aws ec2 describe-addresses \
            --region "${AWS_REGION}" \
            --query 'Addresses[?AssociationId==null].AllocationId' \
            --output text); do
            echo "Releasing Elastic IP: $alloc_id"
            aws ec2 release-address \
              --allocation-id "$alloc_id" \
              --region "${AWS_REGION}"
          done

          echo "=== NAT + EIP cleanup done ==="

      # ✅ FIX 3: ArgoCD CRDs Remove
      - name: Pre-destroy - Remove ArgoCD CRDs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Configuring kubectl ==="
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${PROJECT_NAME}"

          echo "=== Deleting ArgoCD resources ==="
          kubectl delete applications --all \
            -n argocd --ignore-not-found=true || true
          kubectl delete applicationsets --all \
            -n argocd --ignore-not-found=true || true

          echo "=== Uninstalling ArgoCD Helm ==="
          helm uninstall argocd \
            -n argocd --timeout 120s || true

          echo "=== Deleting ArgoCD CRDs ==="
          kubectl delete crd applications.argoproj.io \
            --ignore-not-found=true || true
          kubectl delete crd applicationsets.argoproj.io \
            --ignore-not-found=true || true
          kubectl delete crd appprojects.argoproj.io \
            --ignore-not-found=true || true

          echo "=== ArgoCD cleanup done ==="

      - name: Render backend config for Terraform
        shell: bash
        run: |
          set -euo pipefail

          cat > infra/terraform/backend.hcl <<EOF
          bucket       = "${TF_STATE_BUCKET}"
          key          = "${TF_STATE_KEY}"
          region       = "${AWS_REGION}"
          use_lockfile = true
          EOF

      - name: Initialize Terraform with remote state
        run: terraform init -input=false -backend-config=backend.hcl
        working-directory: infra/terraform

      - name: Destroy the EKS stack
        run: |
          terraform destroy -auto-approve \
            -lock=false \
            -var "aws_region=${AWS_REGION}" \
            -var "project_name=${PROJECT_NAME}" \
            -var "db_password=${{ secrets.TF_VAR_db_password }}" \
            -var "grafana_password=${{ secrets.GRAFANA_PASSWORD }}"
        working-directory: infra/terraform

      - name: Remove known ECR repositories
        shell: bash
        run: |
          set -euo pipefail

          services=(frontend backend api)

          for service in "${services[@]}"; do
            repository_name="${PROJECT_NAME}-${service}"

            if aws ecr describe-repositories \
              --region "${AWS_REGION}" \
              --repository-names "${repository_name}" >/dev/null 2>&1; then
              echo "Deleting ECR repo: ${repository_name}"
              aws ecr delete-repository \
                --region "${AWS_REGION}" \
                --repository-name "${repository_name}" \
                --force
            else
              echo "ECR repo not found (skipping): ${repository_name}"
            fi
          done

      - name: Remove Terraform state objects from S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 rm "s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}" || true
          aws s3 rm "s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}.tflock" || true

      - name: Optionally delete the Terraform backend bucket
        if: github.event.inputs.destroy_backend_bucket == 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws s3 rb "s3://${TF_STATE_BUCKET}" --force

      - name: Summarize destroy result
        shell: bash
        run: |
          {
            echo "## Destroy Complete"
            echo ""
            echo "- Project: ${PROJECT_NAME}"
            echo "- Region: ${AWS_REGION}"
            echo "- State bucket removed: ${{ github.event.inputs.destroy_backend_bucket }}"
          } >> "$GITHUB_STEP_SUMMARY"